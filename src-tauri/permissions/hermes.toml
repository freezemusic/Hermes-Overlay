[[permission]]
identifier = "allow-get-settings"
description = "Read overlay settings without secrets."
commands.allow = ["get_settings"]

[[permission]]
identifier = "allow-save-settings"
description = "Save gateway settings and keychain entries."
commands.allow = ["save_settings"]

[[permission]]
identifier = "allow-probe-gateway"
description = "Probe the Hermes gateway and saved bot keys."
commands.allow = ["probe_gateway"]

[[permission]]
identifier = "allow-discover-profiles"
description = "Experimentally list dashboard profiles."
commands.allow = ["discover_profiles"]

[[permission]]
identifier = "allow-open-bot"
description = "Load a bot chat transcript."
commands.allow = ["open_bot"]

[[permission]]
identifier = "allow-select-session"
description = "Pin one Hermes session for a profile."
commands.allow = ["select_session"]

[[permission]]
identifier = "allow-send-chat"
description = "Stream a chat turn."
commands.allow = ["send_chat"]

[[permission]]
identifier = "allow-stop-chat"
description = "Stop the local chat stream."
commands.allow = ["stop_chat"]

[[permission]]
identifier = "allow-list-commands"
description = "List overlay slash commands for one bot."
commands.allow = ["list_commands"]

[[permission]]
identifier = "allow-client-command"
description = "Run a client slash command against the Hermes session API."
commands.allow = ["client_command"]

[[permission]]
identifier = "allow-get-kanban-board"
description = "Read an overlay-slash kanban board."
commands.allow = ["get_kanban_board"]

[[permission]]
identifier = "allow-patch-kanban-task"
description = "Move or edit an overlay-slash kanban task."
commands.allow = ["patch_kanban_task"]

[[permission]]
identifier = "allow-list-cron-jobs"
description = "Read Hermes scheduled jobs for each shown profile."
commands.allow = ["list_cron_jobs"]

[[permission]]
identifier = "allow-set-hit-rects"
description = "Report overlay element rectangles for proximity fade."
commands.allow = ["set_hit_rects"]

[[permission]]
identifier = "allow-set-interaction-latch"
description = "Keep the overlay interactive while a field or settings is in use."
commands.allow = ["set_interaction_latch"]

[[permission]]
identifier = "allow-focus-owner"
description = "Read whether the focused OS window belongs to this process."
commands.allow = ["focus_owner"]

[[permission]]
identifier = "allow-arm-pin-close-guard"
description = "Briefly refuse the window-manager close that a keep-above toggle can cause."
commands.allow = ["arm_pin_close_guard"]

[[permission]]
identifier = "allow-quit-app"
description = "Quit the overlay from the Settings 結束 button."
commands.allow = ["quit_app"]

[[permission]]
identifier = "allow-read-soul"
description = "Read one bot profile SOUL.md."
commands.allow = ["read_soul"]

[[permission]]
identifier = "allow-write-soul"
description = "Write one bot profile SOUL.md."
commands.allow = ["write_soul"]

[[permission]]
identifier = "allow-save-bot-meta"
description = "Save one bot display name and detail."
commands.allow = ["save_bot_meta"]

[[permission]]
identifier = "allow-sync-profiles"
description = "Discover Hermes profiles into the roster without inventing API keys."
commands.allow = ["sync_profiles"]

[[permission]]
identifier = "allow-set-profile-enabled"
description = "Show or hide one roster profile without deleting its key."
commands.allow = ["set_profile_enabled"]

[[permission]]
identifier = "allow-debug-log-enabled"
description = "Report whether HERMES_OVERLAY_DEBUG_LOG is set."
commands.allow = ["debug_log_enabled"]

[[permission]]
identifier = "allow-debug-log"
description = "Append one line when HERMES_OVERLAY_DEBUG_LOG is set."
commands.allow = ["debug_log"]

[[permission]]
identifier = "allow-fit-overlay"
description = "Size the hidden overlay to the monitor before the first paint."
commands.allow = ["fit_overlay"]

[[permission]]
identifier = "allow-reveal-overlay"
description = "Show the overlay after the first transparent paint."
commands.allow = ["reveal_overlay"]
